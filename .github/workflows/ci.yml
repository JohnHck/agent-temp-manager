name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the workflow only checks out and runs the test suite.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tests only create and remove their own sandbox under %TEMP%\atm-tests-* and a test key under
    # HKCU\Software\AgentTempManagerTest. They never touch real agent temporary directories, never delete
    # outside the sandbox and never change machine PATH or ACLs outside the sandbox.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      ATM_PWSH: C:\Program Files\PowerShell\7\pwsh.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # A step's `shell` cannot read the matrix context, so each shell has its own literal step.
      - name: Tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/Run-Tests.ps1 -SkipHeavy -ReportFile test-results-powershell.json
      - name: Tests (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          ./tests/Run-Tests.ps1 -SkipHeavy -ReportFile test-results-pwsh.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.shell }}
          path: test-results-${{ matrix.shell }}.json
          if-no-files-found: warn
          retention-days: 14

  # FINAL-A: the same suite on Windows 11 ARM64 (the native safe-creation code and its fixture tests run there too).
  # A separate job, so the names of the existing checks do not change.
  test-arm64:
    name: test ARM64 (${{ matrix.shell }})
    runs-on: windows-11-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      ATM_PWSH: C:\Program Files\PowerShell\7\pwsh.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (Windows PowerShell 5.1, ARM64)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString(); $env:PROCESSOR_ARCHITECTURE
          ./tests/Run-Tests.ps1 -SkipHeavy -ReportFile test-results-arm64-powershell.json
      - name: Tests (PowerShell 7, ARM64)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString(); $env:PROCESSOR_ARCHITECTURE
          ./tests/Run-Tests.ps1 -SkipHeavy -ReportFile test-results-arm64-pwsh.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-arm64-${{ matrix.shell }}
          path: test-results-arm64-${{ matrix.shell }}.json
          if-no-files-found: warn
          retention-days: 14

  # Informative (not a required check): reports personal e-mail addresses in commit metadata. On a pull request it
  # checks base..head; on a push to main it checks before..after, which also covers commits GitHub creates when it
  # merges. A push check only detects: the commit is already public (see docs/SECURITY-MODEL.md, "Commit identity").
  commit-identity:
    name: commit identity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check author, committer and trailers
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            ./tools/Test-AtmCommitIdentity.ps1 -Range "$($env:PR_BASE_SHA)..$($env:PR_HEAD_SHA)"
          } elseif ($env:EVENT_NAME -eq 'push') {
            git cat-file -e "$($env:PUSH_BEFORE)^{commit}" 2>$null
            if ($env:PUSH_BEFORE -notmatch '^0+$' -and $LASTEXITCODE -eq 0) {
              ./tools/Test-AtmCommitIdentity.ps1 -Range "$($env:PUSH_BEFORE)..$($env:PUSH_AFTER)"
            } else {
              ./tools/Test-AtmCommitIdentity.ps1 -Commit $env:PUSH_AFTER
            }
          } else {
            ./tools/Test-AtmCommitIdentity.ps1 -All
          }
          exit $LASTEXITCODE

  # Real installation on disposable GitHub-hosted VMs (administrator, UAC disabled): build the release, install
  # for real, CLI from a new process, V0.1 clean never deletes, update, rollback, tamper detection, a real standard
  # user (created only in the VM), uninstall. Not a required check. UAC prompts and filtered tokens cannot be
  # tested here (see docs/TESTING.md, privilege matrix).
  # The package is built once (privacy gate included) and the same zip is installed on every OS.
  build-package:
    name: build package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build release (privacy gate)
        shell: powershell
        run: |
          ./tools/Build-Release.ps1 -SkipTests
          exit $LASTEXITCODE
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  install-e2e:
    name: install e2e (${{ matrix.os }}, installer ${{ matrix.installer }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, windows-11-arm]
        installer: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: End-to-end installation
        shell: powershell
        env:
          INSTALLER_SHELL: ${{ matrix.installer }}
        run: |
          ./tests/e2e/Invoke-InstallE2E.ps1 -OutDir "$env:RUNNER_TEMP\atm-e2e" -InstallerShell $env:INSTALLER_SHELL -ReleaseDir "$env:RUNNER_TEMP\release-package"
          exit $LASTEXITCODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: install-e2e-${{ matrix.os }}-${{ matrix.installer }}
          path: ${{ runner.temp }}/atm-e2e
          if-no-files-found: warn
          retention-days: 14

  # Informative (not a required check, never fails on findings): PSScriptAnalyzer pinned by version and package
  # SHA-512, module signatures verified, imported by path. Fails only if integrity or the tool itself fails.
  static-analysis:
    name: static analysis (PSScriptAnalyzer)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer (informative)
        shell: pwsh
        run: |
          ./tools/Invoke-AtmStaticAnalysis.ps1 -WorkDir "$env:RUNNER_TEMP\atm-static-analysis" -ReportFile static-analysis.json
          exit $LASTEXITCODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: static-analysis
          path: static-analysis.json
          if-no-files-found: warn
          retention-days: 14
