name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Tests (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1 -SkipHeavy -ReportFile test-results-${{ matrix.shell }}.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: test-results-${{ matrix.shell }}.json
